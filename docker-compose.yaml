services:
  oracle:
    image: 'gvenzl/oracle-free:latest'
    container_name: oracle
    environment:
      - 'ORACLE_PASSWORD=secret'
      - 'APP_USER=georural_app'
      - 'APP_USER_PASSWORD=secret'
    ports:
      - '1521:1521'
    volumes:
      - oracle-data:/opt/oracle/oradata

volumes:
  oracle-data: