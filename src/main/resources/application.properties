spring.datasource.url=jdbc:oracle:thin:@localhost:1521/FREEPDB1
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.flyway.enabled=true
spring.docker.compose.enabled=false

spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=210MB

oci.namespace=${OCI_NAMESPACE}
oci.bucket=${OCI_BUCKET}
oci.zona-bruta=${OCI_ZONA_BRUTA:bruta}

app.cors.origens=${APP_CORS_ORIGENS:http://localhost:*,http://127.0.0.1:*,http://[::1]:*}
