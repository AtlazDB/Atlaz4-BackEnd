spring.datasource.url=jdbc:oracle:thin:@localhost:1521/FREEPDB1
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.flyway.enabled=true
# As migrations são reservadas por tarefa (V8 Tarefa 4, V9 Tarefa 5, V10 Tarefa 6, V11 Tarefa 2, V12 Tarefa 3)
# e chegam fora de ordem. Sem isto, uma V8 que chega depois da V9 já aplicada impede o back de subir.
spring.flyway.out-of-order=true
spring.docker.compose.enabled=false

spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=510MB

oci.namespace=${OCI_NAMESPACE}
oci.bucket=${OCI_BUCKET}
oci.zona-bruta=${OCI_ZONA_BRUTA:bruta}

app.cors.origens=${APP_CORS_ORIGENS:http://localhost:*,http://127.0.0.1:*,http://[::1]:*}

# true: o processamento do CAR fica com o Airflow (DAG varredor_bruta); false: o back-end processa.
app.processamento.airflow=${AIRFLOW_HABILITADO:false}
